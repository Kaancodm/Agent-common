name: Release Agent Common

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the tag matches the plugin manifest
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = str(json.loads(Path(".codex-plugin/plugin.json").read_text("utf-8"))["version"])
          if tag != f"v{version}":
              print(f"tag {tag!r} does not match plugin.json version {version!r} (expected v{version})")
              sys.exit(1)
          print(f"tag {tag} matches plugin.json version {version}")
          PY

      - name: Check release readiness
        run: python scripts/check_release_readiness.py

      - name: Build the plugin package
        run: python scripts/build_plugin_package.py

      - name: Extract release notes from the CHANGELOG
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text("utf-8")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
          if not match:
              print(f"no CHANGELOG section for {version}")
              sys.exit(1)
          body = match.group(1).strip().removesuffix("---").strip()
          Path("RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          print(body)
          PY

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Agent Common $version" \
            --notes-file RELEASE_NOTES.md \
            $prerelease \
            "dist/agent-common-${version}.zip"
